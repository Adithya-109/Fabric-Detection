name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          REQUIRE_TORCH: "1"
        run: |
          python -c "import torch, torchvision; print('torch', torch.__version__)"
          pytest --junitxml=junit.xml
      - name: Report failing tests as annotations
        if: failure()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("junit.xml").getroot()
          n = 0
          for case in root.iter("testcase"):
              for tag in ("failure", "error"):
                  node = case.find(tag)
                  if node is None:
                      continue
                  text = (node.get("message") or "") + " | " + (node.text or "")[-1500:]
                  text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
                  n += 1
          print(f"{n} failing test(s)")
          PY
